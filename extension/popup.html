<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <title>EasyTrader AI Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: 'Estedad', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #38bdf8;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px;
    }
    .dot-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot-amber { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
    .dot-red { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #475569;
      color: #ffffff;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>⚡</span>
      <span>EasyTrader AI Sync</span>
    </div>
    <div class="badge">v1.2.0</div>
  </div>

  <div class="card">
    <div class="status-row">
      <span>پل ارتباطی MCP:</span>
      <span id="bridge-status"><span class="dot dot-amber"></span> در حال بررسی...</span>
    </div>
    <div class="status-row">
      <span>پورت سرور:</span>
      <span style="font-family:monospace;direction:ltr;">127.0.0.1:4821</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-sync">
    <span>🚀</span>
    <span>همگام‌سازی فوری با هوش مصنوعی</span>
  </button>

  <button class="btn btn-secondary" id="btn-copy-bookmarklet">
    <span>📌</span>
    <span>کپی کد بوکمارکلت (بدون افزونه)</span>
  </button>

  <div class="hint" id="status-msg">
    هنگام باز بودن تب ایزی‌تریدر، نشست به صورت خودکار و امن همگام‌سازی می‌شود.
  </div>

  <script src="popup.js"></script>
</body>
</html>
